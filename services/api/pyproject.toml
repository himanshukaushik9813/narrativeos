[project]
name = "narrativeos-api"
version = "0.1.0"
description = "NarrativeOS live SoSoValue agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.8",
  "httpx>=0.28.1",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.8.0",
  "uvicorn[standard]>=0.34.0",
  "web3>=7.8.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.3"
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["narrativeos_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: requires real SoSoValue/SoDEX/settlement-chain credentials or network access"
]

[tool.ruff]
line-length = 100
